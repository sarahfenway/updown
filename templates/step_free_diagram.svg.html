<svg class="step-free-diagram" viewBox="0 0 {{ diagram.width }} {{ diagram.height }}"
     width="{{ diagram.width }}" height="{{ diagram.height }}"
     role="img" aria-labelledby="diagram-title">
    <title id="diagram-title">Step-free routes at {{ station.name }}</title>
    {% for band in diagram.bands %}
        <line class="band" x1="0" x2="{{ diagram.width }}" y1="{{ band.y }}" y2="{{ band.y }}"/>
        <text class="band-label" x="4" y="{{ band.label_y }}">{{ band.label }}</text>
    {% endfor %}
    {% for line in diagram.lines %}
        <polyline class="link {{ line.cls }}" points="{{ line.points }}"/>
        {% if line.label %}<text class="{{ line.label_cls }}" x="{{ line.label_x }}" y="{{ line.label_y }}">{{ line.label }}</text>{% endif %}
    {% endfor %}
    {% for box in diagram.boxes %}
        <rect class="{{ box.cls }}" x="{{ box.x }}" y="{{ box.y }}" width="{{ box.w }}" height="{{ box.h }}" rx="6"/>
        <text class="box-label" text-anchor="middle" x="{{ box.cx }}" y="{{ box.ty }}">{% for text in box.lines %}<tspan x="{{ box.cx }}" dy="{% if forloop.first %}0{% else %}13{% endif %}">{{ text }}</tspan>{% endfor %}</text>
    {% endfor %}
</svg>
