name: Retrain model

# Retrain the incident-duration model on a schedule and upload it only if it
# passes the quality gates in ml/train.py:
#   * overall right-first-time floor      (--min-boundary-accuracy)
#   * per-category right-first-time floor (--min-category-accuracy)
#   * not too many dates two or more days away (--max-long-bound-share)
#   * no regression vs the incumbent's recent live accuracy (--max-regression)
# If any gate fails, train.py exits non-zero and uploads nothing, so a
# regressed model can never auto-ship — the run just goes red.
#
# The Fly Deploy workflow also starts this (through workflow_dispatch, with the
# default inputs) after a successful deploy that changed the training code, so
# the site never waits for the monthly run to get a model matching new code.
#
# Requires a repo secret FUNCTIONS_SECRET_KEY matching the app's env var
# (the same key ml/train.py uses to read training data and upload the model).

on:
  schedule:
    # 04:00 UTC on the 1st of each month — quiet time for the single machine.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      min_boundary_accuracy:
        description: "Floor for overall right-first-time accuracy (0-1)"
        required: false
        default: "0.78"
      min_category_accuracy:
        description: "Floor for each large fault category (0-1)"
        required: false
        default: "0.75"
      max_long_bound_share:
        description: "Max share of dates two or more days away (0-1)"
        required: false
        default: "0.35"
      max_regression:
        description: "Max allowed drop vs incumbent live accuracy (0-1)"
        required: false
        default: "0.05"
      dry_run:
        description: "Train and validate but do not upload"
        type: boolean
        required: false
        default: false

concurrency:
  group: retrain-model
  cancel-in-progress: false

jobs:
  retrain:
    name: Retrain and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the runtime (Dockerfile / requirements.txt) so the trained
          # model is pickled by the same scikit-learn the app will load it with.
          python-version: "3.14"
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pytest
      - name: Test the training code
        run: python -m pytest ml/test_train.py -q -p no:cacheprovider
      - name: Train, validate and (if it passes) upload
        env:
          FUNCTIONS_SECRET_KEY: ${{ secrets.FUNCTIONS_SECRET_KEY }}
        run: |
          python ml/train.py \
            --api-url https://updownlondon.com/api/training-data/ \
            --upload-url https://updownlondon.com/functions/upload_model \
            --key "$FUNCTIONS_SECRET_KEY" \
            --min-boundary-accuracy "${{ github.event.inputs.min_boundary_accuracy || '0.78' }}" \
            --min-category-accuracy "${{ github.event.inputs.min_category_accuracy || '0.75' }}" \
            --max-long-bound-share "${{ github.event.inputs.max_long_bound_share || '0.35' }}" \
            --max-regression "${{ github.event.inputs.max_regression || '0.05' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
